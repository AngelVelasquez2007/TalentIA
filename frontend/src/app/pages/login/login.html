<section class="auth-card"><h1>Talent<span>IA</span></h1><p>Inicia sesión para gestionar tus oportunidades.</p><form (ngSubmit)="entrar()"><label>Correo electrónico<input name="email" type="email" [(ngModel)]="email" required></label><label>Contraseña<input name="password" type="password" [(ngModel)]="password" required></label><p class="error" [hidden]="!error">{{error}}</p><button [disabled]="cargando">{{cargando?'Ingresando...':'Ingresar'}}</button></form><p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p></section>
