<section class="panel"><h1>Postulaciones</h1><p class="muted">Seguimiento de solicitudes y evaluación orientativa.</p><p class="error" [hidden]="!error">{{error}}</p><p *ngIf="!items.length">Todavía no hay postulaciones.</p><article class="job" *ngFor="let p of items"><h3>{{p.vacante}}</h3><p>Estado: <strong>{{p.estado}}</strong> · Compatibilidad: {{p.puntuacion_ia}}%</p><p *ngIf="auth.usuario?.rol !== 'candidato'">Candidato #{{p.candidato_id}}</p><div class="actions" *ngIf="auth.usuario?.rol !== 'candidato'"><button class="secondary" (click)="cambiar(p.id,'revision')">En revisión</button><button class="secondary" (click)="cambiar(p.id,'entrevista')">Entrevista</button><button class="secondary" (click)="cambiar(p.id,'aceptada')">Aceptar</button><button class="danger" (click)="cambiar(p.id,'rechazada')">Rechazar</button></div></article></section>
