<section class="auth-card"><h1>Crear cuenta</h1><p>Registro de candidato</p><form (ngSubmit)="guardar()"><label>Nombre<input name="nombre" [(ngModel)]="nombre" required minlength="2"></label><label>Apellido<input name="apellido" [(ngModel)]="apellido" required minlength="2"></label><label>Correo<input name="email" [(ngModel)]="email" type="email" required></label><label>Contraseña (mínimo 8)<input name="password" [(ngModel)]="password" type="password" minlength="8" required></label><p class="error" [hidden]="!error">{{error}}</p><button>Crear cuenta</button></form><a routerLink="/login">Volver a login</a></section>
